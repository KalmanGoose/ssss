<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>口說英語練習 | Speaking Studio</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1b2742;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.16);
      --amber: #fbbf24;
      --red: #fb7185;
      --red-soft: rgba(251, 113, 133, 0.18);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      height: 100%;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 680px;
      margin: 0 auto;
      padding-top: var(--safe-top);
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 6px;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand-badge {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0b1120;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 7px;
    }

    .timer-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .timer-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 2px 4px;
      cursor: pointer;
    }

    /* Pack Tabs */
    .pack-tabs {
      display: flex;
      gap: 6px;
      padding: 4px 14px 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .pack-tabs::-webkit-scrollbar { display: none; }

    .pack-tab {
      flex-shrink: 0;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pack-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
    }

    /* Sub-filter / Slide jump */
    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 8px;
      gap: 8px;
      flex-shrink: 0;
    }

    .slide-pills {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .slide-pills::-webkit-scrollbar { display: none; }

    .slide-pill {
      flex-shrink: 0;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .slide-pill.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--accent);
    }

    .progress-text {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Main Scrollable Card Area */
    .stage {
      flex: 1;
      overflow-y: auto;
      padding: 2px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--accent);
    }

    .badge-grammar {
      background: rgba(129, 140, 248, 0.16);
      color: #a5b4fc;
    }

    .mastered-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mastered-btn.done {
      background: var(--green-soft);
      color: var(--green);
      border-color: rgba(52, 211, 153, 0.4);
    }

    /* Mode Selector */
    .mode-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 4px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    /* Sentence Display */
    .en-box {
      font-size: 21px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      min-height: 76px;
      word-break: break-word;
    }

    .word-token {
      display: inline-block;
      padding: 1px 2px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .word-token:active {
      background: var(--accent-soft);
    }

    .word-token.kw {
      color: #7dd3fc;
      text-decoration: underline;
      text-decoration-color: rgba(125, 211, 252, 0.45);
      text-underline-offset: 4px;
    }

    .word-token.masked {
      color: transparent;
      background: rgba(148, 163, 184, 0.18);
      border-radius: 6px;
      user-select: none;
    }

    .word-token.masked.peeked {
      color: var(--amber);
      background: rgba(251, 191, 36, 0.14);
    }

    .pause-slash {
      color: var(--amber);
      font-weight: 400;
      font-size: 16px;
      margin: 0 3px;
      opacity: 0.75;
    }

    .blind-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }

    .zh-box {
      font-size: 15px;
      line-height: 1.55;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.5);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: 0 10px 10px 0;
    }

    .tip-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .mini-toggle {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* Speech Recognition Result */
    .eval-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .eval-card.show {
      display: flex;
    }

    .eval-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .score-pill {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
    }

    .score-high { background: var(--green-soft); color: var(--green); }
    .score-mid { background: rgba(251, 191, 36, 0.16); color: var(--amber); }
    .score-low { background: var(--red-soft); color: var(--red); }

    .diff-line {
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .w-ok { color: var(--green); font-weight: 600; }
    .w-miss { color: var(--red); text-decoration: underline wavy rgba(251, 113, 133, 0.6); }

    .heard-raw {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Custom Pack Editor */
    .custom-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .custom-panel.show { display: flex; }

    .custom-textarea {
      width: 100%;
      min-height: 120px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }

    .custom-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-sm {
      background: var(--accent);
      color: #0b1120;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Dock */
    .dock {
      flex-shrink: 0;
      background: rgba(19, 28, 49, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(10px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .speed-group {
      display: flex;
      gap: 4px;
    }

    .chip-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.5);
    }

    .actions-row {
      display: grid;
      grid-template-columns: 0.9fr 1.2fr 1.2fr 0.9fr;
      gap: 8px;
    }

    .act-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease;
    }

    .act-btn:active { transform: scale(0.96); }
    .act-btn .ico { font-size: 17px; line-height: 1; }

    .act-btn.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: transparent;
      color: #fff;
    }

    .act-btn.speaking {
      background: #0ea5e9;
      color: #0b1120;
    }

    .act-btn.mic {
      background: #1e293b;
      border-color: rgba(251, 113, 133, 0.35);
    }

    .act-btn.recording {
      background: var(--red);
      color: #fff;
      border-color: transparent;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(251, 113, 133, 0); }
      100% { box-shadow: 0 0 0 0 rgba(251, 113, 133, 0); }
    }

    .toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 99;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">SPEAK</span>
        <span>英語口說隨身練</span>
      </div>
      <div class="timer-pill">
        <span id="timerDisplay">00:00</span>
        <button class="timer-btn" id="timerToggle">開始</button>
        <button class="timer-btn" id="timerReset" style="color:var(--text-muted)">歸零</button>
      </div>
    </header>

    <div class="pack-tabs" id="packTabs">
      <button class="pack-tab active" data-pack="presentation">🎤 報告逐字稿</button>
      <button class="pack-tab" data-pack="qa">💬 課堂 QA 會話</button>
      <button class="pack-tab" data-pack="daily">☕ 日常口說練習</button>
      <button class="pack-tab" data-pack="custom">✏️ 自訂貼上</button>
    </div>

    <div class="subbar">
      <div class="slide-pills" id="slidePills"></div>
      <div class="progress-text" id="progressText">1 / 33</div>
    </div>

    <main class="stage" id="stage">
      <!-- Custom editor (only visible on custom tab when toggled or empty) -->
      <div class="custom-panel" id="customPanel">
        <div style="font-size:13px;font-weight:700;color:var(--accent)">貼上想練的英文句子或對話（每行一句，可用 | 加上中文翻譯）</div>
        <textarea class="custom-textarea" id="customInput" placeholder="例如：&#10;Have you ever tried pickleball? | 你打過匹克球嗎？&#10;I've been working on this project since September. | 我從九月就開始做這個專題了。"></textarea>
        <div class="custom-actions">
          <button class="chip-btn" id="customCloseBtn">收起編輯</button>
          <button class="btn-sm" id="customSaveBtn">套用開始練習</button>
        </div>
      </div>

      <!-- Main Sentence Card -->
      <section class="card" id="mainCard">
        <div class="card-meta">
          <div class="meta-left">
            <span class="badge" id="unitBadge">Slide 1</span>
            <span class="badge badge-grammar" id="tagBadge">開場</span>
          </div>
          <button class="mastered-btn" id="masteredBtn">✓ 標記熟練</button>
        </div>

        <div class="mode-row">
          <button class="mode-btn active" data-mode="full">👁️ 全文</button>
          <button class="mode-btn" data-mode="keywords">🔑 關鍵字</button>
          <button class="mode-btn" data-mode="blind">🧠 盲講</button>
        </div>

        <div id="enContainer" class="en-box"></div>

        <div class="zh-box" id="zhBox"></div>

        <div class="tip-row">
          <span>點單字可單獨發音 · 左右滑動換句</span>
          <div>
            <button class="mini-toggle" id="toggleEditCustom" style="display:none">編輯內容</button>
            <button class="mini-toggle" id="togglePause">斷句：開</button>
            <button class="mini-toggle" id="toggleZh">中文：開</button>
          </div>
        </div>
      </section>

      <!-- Speech Eval Result -->
      <section class="eval-card" id="evalCard">
        <div class="eval-header">
          <span>🎙️ 跟讀即時比對</span>
          <span class="score-pill" id="scorePill">100%</span>
        </div>
        <div class="diff-line" id="diffLine"></div>
        <div class="heard-raw" id="heardRaw"></div>
      </section>
    </main>

    <!-- Thumb Dock -->
    <footer class="dock">
      <div class="controls-top">
        <div class="speed-group">
          <button class="chip-btn speed-btn" data-rate="0.75">0.75x 慢</button>
          <button class="chip-btn speed-btn active" data-rate="1">1.0x</button>
          <button class="chip-btn speed-btn" data-rate="1.15">1.15x 快</button>
        </div>
        <div class="speed-group">
          <button class="chip-btn" id="loopBtn">🔁 單句循環</button>
          <button class="chip-btn" id="autoPlayBtn">▶ 連播</button>
        </div>
      </div>

      <div class="actions-row">
        <button class="act-btn" id="prevBtn">
          <span class="ico">◀</span>
          <span>上一句</span>
        </button>
        <button class="act-btn primary" id="speakBtn">
          <span class="ico">🔊</span>
          <span id="speakLabel">聽發音</span>
        </button>
        <button class="act-btn mic" id="micBtn">
          <span class="ico">🎙️</span>
          <span id="micLabel">跟讀測驗</span>
        </button>
        <button class="act-btn" id="nextBtn">
          <span class="ico">▶</span>
          <span>下一句</span>
        </button>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const PACKS = {
      presentation: [
        { id: "p1", group: "S1", tag: "開場問候", en: "Hello everyone, and Professor. / My topic is my favorite course.", zh: "大家好，教授好。我的報告主題是「我最喜歡的課」。", kw: ["everyone", "Professor", "topic", "favorite", "course"] },
        { id: "p2", group: "S1", tag: "作品加分", en: "Since our professor said sharing a personal project can earn bonus points, / let me apologize for a quick second— / I'm going to open Safari right now and show you my work!", zh: "因為老師說帶來個人才藝或作品可以加分，所以不好意思打擾一下——我現在要打開 Safari，展示我的作品給大家看！", kw: ["Since", "personal", "project", "bonus", "apologize", "Safari", "show"] },
        { id: "p3", group: "S1", tag: "Unit 2.2: ever", en: "I have a quick question— / have you ever played pickleball?", zh: "我想先問大家一個問題——你們曾經打過匹克球嗎？", kw: ["quick", "question", "have", "ever", "played", "pickleball"] },
        { id: "p4", group: "S1", tag: "比賽專題", en: "Actually, I built a project that's in a coding competition right now— / this pickleball game where you play against an Artificial Intelligence opponent.", zh: "其實我做了一個正在參加程式比賽的專題——就是這款讓你跟人工智慧對手對戰的匹克球遊戲。", kw: ["built", "coding", "competition", "pickleball", "Artificial", "Intelligence", "opponent"] },
        { id: "p5", group: "S1", tag: "QR Code 互動", en: "You can scan the QR code on the screen to try it.", zh: "你們可以掃螢幕上的 QR Code 來試玩。", kw: ["scan", "QR", "code", "screen", "try"] },
        { id: "p6", group: "S1", tag: "主題銜接", en: "And this project is closely connected to my topic— / it gave me a lot of ideas to take Introduction to Generative AI and Machine Learning by Professor Hung-yi Lee at NTU.", zh: "而且這個專題跟我的報告主題有很大的關係——它給了我很多靈感發想，讓我去修臺大李宏毅教授的《生成式人工智慧與機器學習導論》。", kw: ["connected", "ideas", "Generative", "AI", "Machine", "Learning", "NTU"] },
        { id: "p7", group: "S1", tag: "Unit 4.4: unless / if", en: "Here's what he said on day one: / unless you know how AI actually works, you're just a user. / If you understand the ideas behind it, you can build games and tools yourself.", zh: "他在第一天講過一個重點：除非你知道它背後怎麼運作，否則你只是個使用者；只要你懂原理，你也能自己做出遊戲跟工具。", kw: ["unless", "works", "user", "If", "understand", "build", "yourself"] },

        { id: "p8", group: "S2", tag: "過去完成式: had been", en: "Honestly, before I found this class, / Artificial Intelligence had been a total mystery to me.", zh: "老實說，在找到這門課以前，人工智慧對我來說完全是個謎。", kw: ["Honestly", "before", "had", "been", "mystery"] },
        { id: "p9", group: "S2", tag: "Unit 3: had thought", en: "I had thought machine learning was just scary math.", zh: "我以前一直以為機器學習全都是很可怕的數學。", kw: ["had", "thought", "machine", "learning", "scary", "math"] },
        { id: "p10", group: "S2", tag: "假設語氣 Type 3", en: "If I hadn't watched his videos, / I probably wouldn't have touched this field at all.", zh: "如果我當初沒看他的影片，我大概根本不會碰這個領域。", kw: ["If", "hadn't", "watched", "wouldn't", "have", "touched", "field"] },

    // Load custom pack from localStorage
    const CUSTOM_STORAGE_KEY = "speak_studio_custom_v1";
    const MASTERED_STORAGE_KEY = "speak_studio_mastered_v1";

    function loadCustomPack() {
      const saved = localStorage.getItem(CUSTOM_STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch (e) {}
      }
      return [
        { id: "c1", group: "自訂", tag: "範例", en: "Paste your own English sentences by tapping the edit button below!", zh: "點擊下方「編輯內容」，就能貼上任何想練習的英文句子！", kw: ["Paste", "English", "sentences", "edit"] }
      ];
    }
    PACKS.custom = loadCustomPack();

    let state = {
      pack: "presentation",
      groupFilter: "ALL",
      index: 0,
      mode: "full", // full | keywords | blind
      showPause: true,
      showZh: true,
      rate: 1.0,
      loop: false,
      autoPlay: false,
      speaking: false,
      recording: false,
      blindRevealed: false,
      peekedWords: new Set(),
      mastered: new Set(JSON.parse(localStorage.getItem(MASTERED_STORAGE_KEY) || "[]"))
    };

    // Elements
    const packTabs = document.getElementById("packTabs");
    const slidePills = document.getElementById("slidePills");
    const progressText = document.getElementById("progressText");
    const unitBadge = document.getElementById("unitBadge");
    const tagBadge = document.getElementById("tagBadge");
    const masteredBtn = document.getElementById("masteredBtn");
    const enContainer = document.getElementById("enContainer");
    const zhBox = document.getElementById("zhBox");
    const togglePauseBtn = document.getElementById("togglePause");
    const toggleZhBtn = document.getElementById("toggleZh");
    const toggleEditCustomBtn = document.getElementById("toggleEditCustom");
    const customPanel = document.getElementById("customPanel");
    const customInput = document.getElementById("customInput");
    const evalCard = document.getElementById("evalCard");
    const scorePill = document.getElementById("scorePill");
    const diffLine = document.getElementById("diffLine");
    const heardRaw = document.getElementById("heardRaw");
    const speakBtn = document.getElementById("speakBtn");
    const speakLabel = document.getElementById("speakLabel");
    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");
    const loopBtn = document.getElementById("loopBtn");
    const autoPlayBtn = document.getElementById("autoPlayBtn");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function getFilteredList() {
      const list = PACKS[state.pack] || [];
      if (state.groupFilter === "ALL") return list;
      return list.filter(item => item.group === state.groupFilter);
    }

    function currentItem() {
      const list = getFilteredList();
      if (list.length === 0) return null;
      if (state.index >= list.length) state.index = 0;
      if (state.index < 0) state.index = list.length - 1;
      return list[state.index];
    }

    function cleanSpeechText(str) {
      return str.replace(/\s*\/\s*/g, " ").replace(/\s+/g, " ").trim();
    }

    // Build slide/group pills
    function renderGroupPills() {
      const list = PACKS[state.pack] || [];
      const groups = ["ALL", ...new Set(list.map(i => i.group))];
      slidePills.innerHTML = "";
      if (groups.length <= 2) {
        slidePills.style.display = "none";
      } else {
        slidePills.style.display = "flex";
        groups.forEach(g => {
          const btn = document.createElement("button");
          btn.className = "slide-pill" + (state.groupFilter === g ? " active" : "");
          btn.textContent = g === "ALL" ? "全部" : g;
          btn.onclick = () => {
            state.groupFilter = g;
            state.index = 0;
            state.blindRevealed = false;
            state.peekedWords.clear();
            evalCard.classList.remove("show");
            render();
          };
          slidePills.appendChild(btn);
        });
      }
    }

    function render() {
      const list = getFilteredList();
      const item = currentItem();

      // Mastered count
      const masteredCount = list.filter(i => state.mastered.has(i.id)).length;
      progressText.textContent = list.length
        ? `${state.index + 1} / ${list.length} · ✓${masteredCount}`
        : "0 / 0";

      toggleEditCustomBtn.style.display = state.pack === "custom" ? "inline-block" : "none";

      if (!item) return;

      unitBadge.textContent = item.group.startsWith("S") ? `Slide ${item.group.slice(1)}` : item.group;
      tagBadge.textContent = item.tag || "口說";

      const isMastered = state.mastered.has(item.id);
      masteredBtn.className = "mastered-btn" + (isMastered ? " done" : "");
      masteredBtn.textContent = isMastered ? "✓ 已練熟" : "✓ 標記熟練";

      // Render English text according to mode
      enContainer.innerHTML = "";
      const kwLower = new Set((item.kw || []).map(w => w.toLowerCase()));

      if (state.mode === "blind" && !state.blindRevealed) {
        const plainWords = cleanSpeechText(item.en).split(/\s+/).length;
        const box = document.createElement("div");
        box.className = "blind-box";
        box.innerHTML = `<div style="font-weight:700;color:#fff;margin-bottom:4px">🧠 盲講模式（共 ${plainWords} 字）</div><div>看下方中文直接開口講 · 點這裡偷看原文</div>`;
        box.onclick = () => {
          state.blindRevealed = true;
          render();
        };
        enContainer.appendChild(box);
      } else {
        const parts = item.en.split(/(\s+)/);
        let tokenIdx = 0;
        parts.forEach(part => {
          if (/^\s+$/.test(part)) {
            enContainer.appendChild(document.createTextNode(" "));
            return;
          }
          if (part === "/") {
            if (state.showPause) {
              const s = document.createElement("span");
              s.className = "pause-slash";
              s.textContent = "/";
              enContainer.appendChild(s);
            }
            return;
          }
          const idx = tokenIdx++;
          const stripped = part.replace(/^[^\w']+|[^\w']+$/g, "").toLowerCase();
          const isKw = kwLower.has(stripped);
          const span = document.createElement("span");
          let cls = "word-token";
          if (isKw) cls += " kw";
          if (state.mode === "keywords" && !isKw) {
            cls += " masked";
            if (state.peekedWords.has(idx)) cls += " peeked";
          }
          span.className = cls;
          span.textContent = part;
          span.onclick = () => {
            if (state.mode === "keywords" && !isKw && !state.peekedWords.has(idx)) {
              state.peekedWords.add(idx);
              span.classList.add("peeked");
            }
            speakText(stripped || part, true);
          };
          enContainer.appendChild(span);
        });
      }

      // Chinese box
      zhBox.style.display = state.showZh ? "block" : "none";
      zhBox.textContent = item.zh || "（無中文翻譯）";

      togglePauseBtn.textContent = state.showPause ? "斷句：開" : "斷句：關";
      toggleZhBtn.textContent = state.showZh ? "中文：開" : "中文：關";
    }

    // ---- Web Speech Synthesis (iOS Safari resilient) ----
    let enVoice = null;
    function pickEnglishVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      return (
        voices.find(v => v.lang === "en-US" && /Samantha|Daniel|Alex|Aaron|Google US/i.test(v.name)) ||
        voices.find(v => v.lang === "en-US") ||
        voices.find(v => v.lang.startsWith("en")) ||
        null
      );
    }
    if ("speechSynthesis" in window) {
      enVoice = pickEnglishVoice();
      window.speechSynthesis.onvoiceschanged = () => { enVoice = pickEnglishVoice(); };
    }

    function stopSpeaking() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      state.speaking = false;
      state.autoPlay = false;
      speakBtn.classList.remove("speaking");
      speakLabel.textContent = "聽發音";
      autoPlayBtn.classList.remove("active");
    }

    function speakText(text, singleWord = false) {
      if (!("speechSynthesis" in window)) {
        showToast("此瀏覽器不支援語音朗讀");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if (!enVoice) enVoice = pickEnglishVoice();
      if (enVoice) utter.voice = enVoice;
      utter.lang = "en-US";
      utter.rate = singleWord ? 0.9 : state.rate;

      if (!singleWord) {
        state.speaking = true;
        speakBtn.classList.add("speaking");
        speakLabel.textContent = "停止";
      }

      utter.onend = () => {
        if (singleWord) return;
        state.speaking = false;
        speakBtn.classList.remove("speaking");
        speakLabel.textContent = "聽發音";

        if (state.loop) {
          setTimeout(() => {
            const it = currentItem();
            if (it && state.loop) speakText(cleanSpeechText(it.en));
          }, 450);
        } else if (state.autoPlay) {
          setTimeout(() => {
            if (!state.autoPlay) return;
            const list = getFilteredList();
            if (state.index < list.length - 1) {
              stepSentence(1, true);
            } else {
              state.autoPlay = false;
              autoPlayBtn.classList.remove("active");
              showToast("全部帶讀完畢！");
            }
          }, 550);
        }
      };

      utter.onerror = () => {
        state.speaking = false;
        speakBtn.classList.remove("speaking");
        speakLabel.textContent = "聽發音";
      };

      window.speechSynthesis.speak(utter);
    }

    function stepSentence(delta, autoSpeak = false) {
      const list = getFilteredList();
      if (!list.length) return;
      state.index = (state.index + delta + list.length) % list.length;
      state.blindRevealed = false;
      state.peekedWords.clear();
      evalCard.classList.remove("show");
      render();
      if (autoSpeak) {
        const it = currentItem();
        if (it) speakText(cleanSpeechText(it.en));
      }
    }

    // ---- Speech Recognition (跟讀評測) ----
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    function normalizeWords(str) {
      const exp = str
        .toLowerCase()
        .replace(/’/g, "'")
        .replace(/\bi'm\b/g, "i am")
        .replace(/\byou're\b/g, "you are")
        .replace(/\bhe's\b/g, "he is")
        .replace(/\bit's\b/g, "it is")
        .replace(/\bthat's\b/g, "that is")
        .replace(/\bhere's\b/g, "here is")
        .replace(/\bi've\b/g, "i have")
        .replace(/\byou've\b/g, "you have")
        .replace(/\bi'd\b/g, "i would")
        .replace(/\byou'll\b/g, "you will")
        .replace(/\bdon't\b/g, "do not")
        .replace(/\bdoesn't\b/g, "does not")
        .replace(/\bdidn't\b/g, "did not")
        .replace(/\bcan't\b/g, "can not")
        .replace(/\bhaven't\b/g, "have not")
        .replace(/\bhadn't\b/g, "had not")
        .replace(/\bwouldn't\b/g, "would not")
        .replace(/[^a-z0-9\s]/g, " ")
        .trim();
      return exp ? exp.split(/\s+/) : [];
    }

    function evaluateSpeech(targetEn, spokenText) {
      const rawTokens = cleanSpeechText(targetEn).split(/\s+/);
      const spokenSet = new Set(normalizeWords(spokenText));

      let hit = 0;
      let total = 0;
      diffLine.innerHTML = "";

      rawTokens.forEach(tok => {
        const normParts = normalizeWords(tok);
        const span = document.createElement("span");
        span.textContent = tok;
        if (normParts.length === 0) {
          span.className = "w-ok";
        } else {
          total++;
          const matched = normParts.every(p => spokenSet.has(p));
          if (matched) {
            hit++;
            span.className = "w-ok";
          } else {
            span.className = "w-miss";
          }
        }
        diffLine.appendChild(span);
      });

      const pct = total > 0 ? Math.round((hit / total) * 100) : 0;
      scorePill.textContent = `${pct}% 吻合`;
      scorePill.className = "score-pill " + (pct >= 80 ? "score-high" : pct >= 50 ? "score-mid" : "score-low");
      heardRaw.textContent = `辨識結果："${spokenText}"`;
      evalCard.classList.add("show");
    }

    function toggleRecording() {
      if (!SpeechRec) {
        showToast("此瀏覽器不支援語音辨識，建議用 Safari 或 Chrome");
        return;
      }
      if (state.recording && recognition) {
        recognition.stop();
        return;
      }
      stopSpeaking();
      const item = currentItem();
      if (!item) return;

      recognition = new SpeechRec();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      state.recording = true;
      micBtn.classList.add("recording");
      micLabel.textContent = "聆聽中...";

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        evaluateSpeech(item.en, transcript);
      };

      recognition.onerror = (e) => {
        if (e.error === "not-allowed") {
          showToast("請允許麥克風權限才能測驗發音");
        } else if (e.error !== "aborted") {
          showToast("沒聽清楚，請再按一次重唸");
        }
      };

      recognition.onend = () => {
        state.recording = false;
        micBtn.classList.remove("recording");
        micLabel.textContent = "跟讀測驗";
      };

      recognition.start();
    }

    // ---- Event Listeners ----
    packTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".pack-tab");
      if (!btn) return;
      stopSpeaking();
      document.querySelectorAll(".pack-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.pack = btn.dataset.pack;
      state.groupFilter = "ALL";
      state.index = 0;
      state.blindRevealed = false;
      state.peekedWords.clear();
      evalCard.classList.remove("show");

      if (state.pack === "custom") {
        customInput.value = PACKS.custom.map(c => `${cleanSpeechText(c.en)} | ${c.zh}`).join("\n");
        if (PACKS.custom.length <= 1) customPanel.classList.add("show");
      } else {
        customPanel.classList.remove("show");
      }

      renderGroupPills();
      render();
    });

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        state.blindRevealed = false;
        state.peekedWords.clear();
        render();
      };
    });

    masteredBtn.onclick = () => {
      const it = currentItem();
      if (!it) return;
      if (state.mastered.has(it.id)) state.mastered.delete(it.id);
      else state.mastered.add(it.id);
      localStorage.setItem(MASTERED_STORAGE_KEY, JSON.stringify([...state.mastered]));
      render();
    };

    togglePauseBtn.onclick = () => { state.showPause = !state.showPause; render(); };
    toggleZhBtn.onclick = () => { state.showZh = !state.showZh; render(); };
    toggleEditCustomBtn.onclick = () => { customPanel.classList.toggle("show"); };
    document.getElementById("customCloseBtn").onclick = () => { customPanel.classList.remove("show"); };

    document.getElementById("customSaveBtn").onclick = () => {
      const lines = customInput.value.split("\n").map(l => l.trim()).filter(Boolean);
      if (!lines.length) {
        showToast("請至少輸入一句英文");
        return;
      }
      PACKS.custom = lines.map((line, idx) => {
        const [en, zh] = line.split("|").map(s => s.trim());
        const words = (en || "").split(/\s+/).filter(w => w.length >= 5).slice(0, 4).map(w => w.replace(/[^\w]/g, ""));
        return { id: "c_" + idx, group: "自訂", tag: `第 ${idx + 1} 句`, en: en || line, zh: zh || "", kw: words };
      });
      localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(PACKS.custom));
      customPanel.classList.remove("show");
      state.index = 0;
      renderGroupPills();
      render();
      showToast(`已載入 ${PACKS.custom.length} 句！`);
    };

    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.rate = parseFloat(btn.dataset.rate);
      };
    });

    loopBtn.onclick = () => {
      state.loop = !state.loop;
      if (state.loop) {
        state.autoPlay = false;
        autoPlayBtn.classList.remove("active");
      }
      loopBtn.classList.toggle("active", state.loop);
    };

    autoPlayBtn.onclick = () => {
      if (state.autoPlay) {
        stopSpeaking();
        return;
      }
      state.autoPlay = true;
      state.loop = false;
      loopBtn.classList.remove("active");
      autoPlayBtn.classList.add("active");
      const it = currentItem();
      if (it) speakText(cleanSpeechText(it.en));
    };

    speakBtn.onclick = () => {
      if (state.speaking) {
        stopSpeaking();
      } else {
        const it = currentItem();
        if (it) speakText(cleanSpeechText(it.en));
      }
    };

    micBtn.onclick = toggleRecording;
    document.getElementById("prevBtn").onclick = () => { stopSpeaking(); stepSentence(-1); };
    document.getElementById("nextBtn").onclick = () => { stopSpeaking(); stepSentence(1); };

    // Touch swipe on mainCard
    let touchStartX = 0;
    let touchStartY = 0;
    const mainCard = document.getElementById("mainCard");
    mainCard.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    mainCard.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        stopSpeaking();
        stepSentence(dx < 0 ? 1 : -1);
      }
    }, { passive: true });

    // Timer logic
    let timerSec = 0;
    let timerId = null;
    const timerDisplay = document.getElementById("timerDisplay");
    const timerToggle = document.getElementById("timerToggle");
    function fmtTime(s) {
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return `${m}:${sec}`;
    }
    timerToggle.onclick = () => {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        timerToggle.textContent = "繼續";
      } else {
        timerId = setInterval(() => {
          timerSec++;
          timerDisplay.textContent = fmtTime(timerSec);
        }, 1000);
        timerToggle.textContent = "暫停";
      }
    };
    document.getElementById("timerReset").onclick = () => {
      clearInterval(timerId);
      timerId = null;
      timerSec = 0;
      timerDisplay.textContent = "00:00";
      timerToggle.textContent = "開始";
    };

    // Init
    renderGroupPills();
    render();
  </script>
</body>
</html>
